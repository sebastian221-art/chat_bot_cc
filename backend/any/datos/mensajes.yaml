aviso_privacidad:
  version: "2026-10"
  texto: >-
    🔒 Un aviso rápido antes de seguir: al continuar esta conversación autorizas el
    tratamiento de tus datos personales para atenderte y mejorar el servicio, conforme
    a la *Ley 1581 de 2012*. Puedes consultar, actualizar o eliminar tus datos cuando
    quieras: escribe *"eliminar mis datos"* o escribe a *{correo}*.

borrado_confirmar: >-
  Entiendo que quieres eliminar tus datos personales 🔒. Esto borra tu historial de
  conversación y lo que sé de ti; la próxima vez que escribas será como empezar de cero.

  ¿Confirmas? Responde *"sí, eliminar"* para confirmar, o cualquier otra cosa para cancelar.

borrado_hecho: >-
  ✅ Listo. Tus datos personales fueron eliminados. Si vuelves a escribir, empezamos de cero.
  Para cualquier otra solicitud sobre tus datos: *{correo}*.

borrado_cancelado: "Perfecto, no borré nada. ¿En qué te ayudo?"

